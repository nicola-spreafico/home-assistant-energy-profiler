reset:
  name: Reset
  description: Zero a resettable entity (lifetime accumulators, cycle counters, peak power). No-op on entities with nothing to reset.
  fields:
    entity_id:
      name: Entity
      description: The entity to reset.
      required: true
      selector:
        entity:
          integration: energy_profiler

# ---------------------------------------------------------------------------
# Lean Utility Meter maintenance, re-exposed here.
#
# The period meters are genuine Lean entities, but they are added on this
# integration's platform (so they can belong to a device), and Home Assistant
# registers entity services under the *platform's* domain. So these are the
# calls that reach them: `energy_profiler.thin_history`, not
# `lean_utility_meter.thin_history`. The Lean-domain services still exist and
# still serve meters you declared in Lean's own YAML.
# ---------------------------------------------------------------------------

thin_history:
  name: Thin History
  description: Retroactively clean intermediate hourly/5-minute points for the selected period meters, preserving only consolidated period peaks.
  fields:
    entity_id:
      name: Entities
      description: The period meters to thin.
      required: true
      selector:
        entity:
          integration: energy_profiler

calibrate:
  name: Calibrate
  description: Calibrate a period meter to a specific value.
  fields:
    entity_id:
      name: Entity
      description: The period meter to calibrate.
      required: true
      selector:
        entity:
          integration: energy_profiler
    value:
      name: Value
      description: The new value for the meter.
      required: true
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.001
          mode: box

import_history:
  name: Import History
  description: Import historical statistics from another entity into this period meter.
  fields:
    entity_id:
      name: Entity
      description: The period meter to import data into.
      required: true
      selector:
        entity:
          integration: energy_profiler
    source_entity:
      name: Source Entity
      description: The entity ID to import statistics from.
      required: true
      selector:
        entity: {}

clear_history:
  name: Clear History
  description: Permanently delete all historical statistics for this period meter.
  fields:
    entity_id:
      name: Entity
      description: The period meter to clear.
      required: true
      selector:
        entity:
          integration: energy_profiler
    confirm_deletion:
      name: Confirm Deletion
      description: Type 'DELETE' to confirm you want to permanently destroy all historical data for this entity.
      required: true
      selector:
        text:
