reset:
  name: Reset
  description: Zero a resettable entity (lifetime accumulators, cycle counters, peak power). No-op on entities with nothing to reset.
  fields:
    entity_id:
      name: Entity
      description: The entity to reset.
      required: true
      selector:
        entity:
          integration: energy_insights_monitor

thin_history:
  name: Thin History
  description: Retroactively clean intermediate hourly/5-minute points for the selected cycle meters, preserving only consolidated period peaks.
  fields:
    entity_id:
      name: Entities
      description: The cycle meter entities to thin.
      required: true
      selector:
        entity:
          integration: energy_insights_monitor

calibrate:
  name: Calibrate
  description: Calibrate the cycle meter to a specific value.
  fields:
    entity_id:
      name: Entity
      description: The cycle meter entity to calibrate.
      required: true
      selector:
        entity:
          integration: energy_insights_monitor
    value:
      name: Value
      description: The new value for the meter.
      required: true
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.001
          mode: box

import_history:
  name: Import History
  description: Import historical statistics from another entity into this cycle meter.
  fields:
    entity_id:
      name: Entity
      description: The cycle meter entity to import data into.
      required: true
      selector:
        entity:
          integration: energy_insights_monitor
    source_entity:
      name: Source Entity
      description: The entity ID to import statistics from.
      required: true
      selector:
        entity: {}

clear_history:
  name: Clear History
  description: Permanently delete all historical statistics for this cycle meter.
  fields:
    entity_id:
      name: Entity
      description: The cycle meter entity to clear.
      required: true
      selector:
        entity:
          integration: energy_insights_monitor
    confirm_deletion:
      name: Confirm Deletion
      description: Type 'DELETE' to confirm you want to permanently destroy all historical data for this entity.
      required: true
      selector:
        text:
