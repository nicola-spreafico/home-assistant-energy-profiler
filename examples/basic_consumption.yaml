# ─────────────────────────────────────────────────────────────────────────────
# Example: basic per-device consumption
# ─────────────────────────────────────────────────────────────────────────────
# The minimum useful setup: track a single appliance's energy and cost across
# daily / monthly / yearly periods. Requires only the device's own power and
# energy sensors, plus a price entity for the cost family.
#
# Entities created (prefix = <name> + name_suffix):
#   sensor.dishwasher_em_energy_daily        (kWh, 1 LTS row/day)
#   sensor.dishwasher_em_energy_monthly      (kWh)
#   sensor.dishwasher_em_energy_yearly       (kWh)
#   sensor.dishwasher_em_energy_cost_lifetime  (€, live accumulator)
#   sensor.dishwasher_em_energy_cost_daily     (€)
#   sensor.dishwasher_em_energy_cost_monthly   (€)
#   sensor.dishwasher_em_energy_cost_yearly    (€)
#
# Without `energy_price` the cost family is skipped and only the energy meters
# are created.
# ─────────────────────────────────────────────────────────────────────────────

energy_insights_monitor:
  defaults:
    energy_price: sensor.energy_price_purchase   # €/kWh
    name_suffix: _em                             # appended to every entity id

  devices:
    - name: dishwasher
      power: sensor.dishwasher_power             # W
      energy: sensor.dishwasher_energy           # kWh, total_increasing
