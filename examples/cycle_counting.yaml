# ─────────────────────────────────────────────────────────────────────────────
# Example: run detection and cycle analytics
# ─────────────────────────────────────────────────────────────────────────────
# Two separate concepts:
#   running:        the detection SIGNAL — creates binary_sensor.<prefix>_running
#                   and nothing else. Useful on its own (automations, standby).
#   cycle_tracking: the analytics CONSUMER — counts each run with its duration,
#                   energy, cost, ... (requires `running:`). Owns the `limits`
#                   used to discard spurious runs. `cycle_tracking: true` enables
#                   it with no limits.
#
# Each valid completed run fires energy_insights_monitor_cycle_completed (or
# _cycle_discarded when limits reject it) — build notifications on those events.
# ─────────────────────────────────────────────────────────────────────────────

energy_insights_monitor:
  defaults:
    energy_price: sensor.energy_price_purchase
    name_suffix: _em

  devices:
    # Power-threshold detection + full analytics: "on" above 5 W (after 30 s),
    # "off" below 2 W (after 2 min) to ride out pauses within a wash program.
    - name: washing_machine
      power: sensor.washing_machine_power
      energy: sensor.washing_machine_energy
      running:
        trigger: power
        on_above: 5          # W
        on_delay: "00:00:30"
        off_below: 2          # W
        off_delay: "00:02:00"
      cycle_tracking:
        limits:
          min_duration: "00:05:00"   # ignore runs shorter than 5 min
          min_energy: 0.05           # ...or below 50 Wh

    # Template-based detection: when threshold logic is not enough, drive the
    # running state from an arbitrary template instead.
    - name: three_d_printer
      power: sensor.three_d_printer_power
      energy: sensor.three_d_printer_energy
      running:
        trigger: template
        available: "{{ has_value('sensor.three_d_printer_state') }}"
        state: "{{ is_state('sensor.three_d_printer_state', 'printing') }}"
      cycle_tracking: true             # analytics with no limits

    # Signal only: the running sensor exists (for automations or standby),
    # but no cycle analytics are built.
    - name: tv
      power: sensor.tv_power
      energy: sensor.tv_energy
      running:
        trigger: power
        on_above: 15
        off_below: 10
